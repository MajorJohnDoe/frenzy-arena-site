<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember Arena — Visual Review</title>
    <style>:root{--bg:#07080b;--panel:#11141a;--line:#4f3b21;--gold:#d9a441;--text:#d8d0bf;--muted:#80796d}*{box-sizing:border-box}html,body{background:var(--bg);min-height:100%;color:var(--text);margin:0}body{padding:22px clamp(16px,4vw,56px) 32px;font-family:Courier New,ui-monospace,monospace}header{justify-content:space-between;align-items:flex-end;gap:24px;max-width:1680px;margin:0 auto 18px;display:flex}h1{color:var(--gold);letter-spacing:.12em;margin:0;font-size:clamp(18px,2.2vw,28px)}p{color:var(--muted);margin:6px 0 0;font-size:13px;line-height:1.5}a{color:var(--gold);border-bottom:1px solid #6b5127;text-decoration:none}.stage{border:1px solid var(--line);background:#0b0d11;max-width:1680px;margin:0 auto;position:relative;overflow:hidden;box-shadow:0 22px 70px #0000008c}.stage:after{content:"";top:0;bottom:0;left:var(--split,50%);pointer-events:none;z-index:5;background:#d9a441cc;width:1px;position:absolute;transform:translate(-1px)}.images{aspect-ratio:16/9;position:relative}.images img{object-fit:contain;background:#0b0d11;width:100%;height:100%;position:absolute;inset:0}#current{clip-path:inset(0 50% 0 0);image-rendering:pixelated}.tag{z-index:6;border:1px solid var(--line);color:var(--gold);letter-spacing:.14em;background:#07080bd1;padding:5px 8px;font-size:11px;position:absolute;top:14px}#tag-current{left:14px}#tag-goal{right:14px}.controls{background:var(--panel);border-top:1px solid #252018;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;display:grid}.controls span{color:var(--muted);letter-spacing:.12em;font-size:11px}input[type=range]{width:100%;accent-color:var(--gold);cursor:ew-resize}.missing{text-align:center;color:var(--muted);place-items:center;padding:24px;font-size:13px;line-height:1.7;display:none;position:absolute;inset:0}.missing strong{color:var(--gold)}@media (max-width:700px){header{flex-direction:column;align-items:flex-start}.controls{grid-template-columns:1fr}.controls span{display:none}}</style>
  </head>
  <body>
    <header>
      <div>
        <h1>VISUAL REVIEW · M0 BOOTSTRAP</h1>
        <p>
          Drag the slider. The left side is the current browser render, the right side is the goal
          reference.
        </p>
      </div>
      <p><a href="./history.html">Visual history</a> · <a href="./">← Back to the live prototype</a></p>
    </header>

    <main class="stage">
      <div class="images">
        <img src="reference/goal.jpg" alt="Goal reference: dark fantasy isometric arena" />
        <img
          id="current"
          src="visual/m0.png"
          alt="Current Ember Arena M0 render"
          onerror="
            document.getElementById('missing').style.display = 'grid';
            this.style.display = 'none';
          "
        />
        <div class="tag" id="tag-current">CURRENT · M0</div>
        <div class="tag" id="tag-goal">GOAL</div>
        <div class="missing" id="missing">
          <div>
            <strong>No M0 capture yet.</strong><br />
            Open the live prototype and run the capture flow in <code>docs/QA.md</code>.
          </div>
        </div>
      </div>
      <div class="controls">
        <span>M0</span>
        <input id="split" type="range" min="0" max="100" value="50" aria-label="Comparison split" />
        <span>GOAL</span>
      </div>
    </main>

    <script>
      const split = document.getElementById('split');
      const current = document.getElementById('current');
      const stage = document.querySelector('.stage');
      const update = () => {
        const v = Number(split.value);
        current.style.clipPath = `inset(0 ${100 - v}% 0 0)`;
        if (stage) stage.style.setProperty('--split', `${v}%`);
      };
      split.addEventListener('input', update);
      update();
    </script>
  </body>
</html>
